apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://sacco-postgres-postgresql.sacco-management-system.svc.cluster.local:5432/saccodb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "sacco"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "sacco"
          # TCP-based, not HTTP-based: this only checks "is something
          # listening on the port yet," with no dependency on knowing an
          # actual health-check path. Safe default until you confirm
          # whether your app exposes /actuator/health or similar — swap
          # to httpGet once you know that path, same pattern as the demo
          # app's deployment.yaml.
          startupProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}